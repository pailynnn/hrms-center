<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ยื่นใบลา · HRMS CENTER</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --amber:#f7941d; --amber-lo:#e07d0a; --amber-glow:rgba(247,148,29,.35);
    --ink:#0d1017; --ink-2:#151a24; --panel:#1b2130; --panel-2:#212838;
    --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
    --txt:#eef1f6; --muted:#8b94a7; --muted-2:#5f6982;
    --ok:#34d399; --ok-bg:rgba(52,211,153,.12); --err:#f87171; --err-bg:rgba(248,113,113,.12); --info:#60a5fa; --info-bg:rgba(96,165,250,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh; display:flex; align-items:flex-start; justify-content:center;
    background:
      radial-gradient(120% 80% at 50% -10%, #23304a 0%, transparent 55%),
      radial-gradient(90% 60% at 50% 110%, #1a1f2e 0%, transparent 60%),
      var(--ink);
    font-family:"Sora","Noto Sans Thai",-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--txt); padding:22px;
  }
  body.lang-mm{ font-family:"Padauk","Noto Sans Thai","Sora",sans-serif; }
  .card{
    width:100%; max-width:420px; position:relative;
    background:linear-gradient(180deg, var(--panel) 0%, var(--ink-2) 100%);
    border:1px solid var(--line-2); border-radius:26px;
    padding:26px 24px 24px;
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 30px 70px -20px rgba(0,0,0,.75);
  }
  .card::before{content:"";position:absolute;top:0;left:22px;right:22px;height:1px;
    background:linear-gradient(90deg,transparent,var(--amber-glow),transparent)}
  .langbar{display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px}
  .langbar button{
    all:unset; cursor:pointer; font-family:inherit;
    padding:5px 13px; border-radius:999px; font-size:12px; font-weight:600; letter-spacing:.2px;
    color:var(--muted); border:1px solid var(--line-2); transition:.18s;
  }
  .langbar button.on{ color:var(--ink); background:var(--amber); border-color:transparent; box-shadow:0 4px 14px -4px var(--amber-glow) }
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .logo{
    width:44px;height:44px;border-radius:13px;flex:none;
    background:linear-gradient(145deg,#ffb04a,#e07d0a);
    display:grid;place-items:center;font-size:20px;font-weight:700;color:#1a1206;
    box-shadow:0 6px 18px -6px var(--amber-glow), 0 1px 0 rgba(255,255,255,.4) inset;
  }
  h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:11.5px;margin-top:2px;line-height:1.5}
  .profile{display:none;align-items:center;gap:10px;margin-bottom:16px;
    padding:10px 12px;background:var(--panel-2);border:1px solid var(--line);border-radius:14px}
  .avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#2a3346;flex:none}
  .name{font-weight:600;font-size:13px}
  .name-sub{font-size:10.5px;color:var(--muted)}

  .section{margin-bottom:16px}
  .label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted-2);font-weight:600;margin-bottom:9px}
  .chips{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .chip{
    all:unset;cursor:pointer;box-sizing:border-box;text-align:center;
    padding:12px 6px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--ink);
    transition:.15s;
  }
  .chips.four{grid-template-columns:1fr 1fr}
  .comphint{display:none;margin-top:9px;padding:10px 12px;border-radius:12px;font-size:11.5px;line-height:1.6;
    background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#fcd34d}
  .chip .ic{font-size:19px;display:block;margin-bottom:4px}
  .chip .tt{font-size:12px;font-weight:600;color:var(--txt);display:block}
  .chip .st{font-size:9.5px;color:var(--muted);display:block;margin-top:1px}
  .chip.on{border-color:var(--amber);background:linear-gradient(160deg,rgba(247,148,29,.16),rgba(247,148,29,.04));
    box-shadow:0 6px 18px -8px var(--amber-glow)}
  .chip.on .tt{color:#ffc169}

  .daterow{display:flex;gap:10px}
  .field{flex:1}
  .field input, .field textarea{
    width:100%;background:var(--ink);border:1.5px solid var(--line-2);border-radius:13px;
    padding:11px 12px;color:var(--txt);font-family:inherit;font-size:13.5px;
  }
  .field input:focus, .field textarea:focus{outline:none;border-color:var(--amber)}
  .field textarea{resize:vertical;min-height:64px}
  .field-label{font-size:11px;color:var(--muted);margin-bottom:6px;display:block}

  .rulebox{
    margin-top:4px;margin-bottom:18px;padding:12px 13px;border-radius:13px;
    background:var(--info-bg);border:1px solid rgba(96,165,250,.25);font-size:11.5px;line-height:1.7;color:#bcd6fb
  }
  .status{font-size:13px;padding:12px 14px;border-radius:13px;margin-bottom:14px;line-height:1.55;display:none;border:1px solid transparent}
  .status.show{display:block}
  .status.ok{background:var(--ok-bg);color:var(--ok);border-color:rgba(52,211,153,.25)}
  .status.err{background:var(--err-bg);color:var(--err);border-color:rgba(248,113,113,.25)}
  .status.info{background:var(--info-bg);color:var(--info);border-color:rgba(96,165,250,.25)}

  button.submit{
    width:100%;border:none;border-radius:16px;padding:16px 10px;font-size:15px;font-weight:600;font-family:inherit;
    cursor:pointer;transition:transform .12s ease, opacity .2s;
    background:linear-gradient(145deg,#ffb04a,var(--amber-lo));color:#1a1206;
    box-shadow:0 10px 26px -10px var(--amber-glow), 0 1px 0 rgba(255,255,255,.35) inset;
  }
  button.submit:active{transform:translateY(1px) scale(.99)}
  button.submit:disabled{opacity:.4;cursor:not-allowed}
  .footer{margin-top:14px;font-size:10.5px;color:var(--muted-2);line-height:1.5;text-align:center}
  .spinner{width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;
    display:inline-block;vertical-align:-3px;margin-right:6px;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* [รอบ 27] ใบรับรองแพทย์ */
  .certbtn{all:unset;cursor:pointer;box-sizing:border-box;display:block;width:100%;text-align:center;padding:12px;border-radius:13px;
    border:1.5px dashed var(--line-2);color:var(--txt);font-size:13px;font-weight:600;background:var(--ink)}
  .certbtn:active{transform:scale(.99)}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
  .thumb{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line-2)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb button{all:unset;cursor:pointer;position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:11px;text-align:center;line-height:20px}
  .certnote{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.55}
  .certnote.err{color:var(--err)}
  .latebox{display:none;margin-top:16px;padding:14px;border-radius:16px;border:1px solid var(--line-2);background:var(--panel-2)}
  .laterow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .laterow:first-of-type{border-top:none}
  .laterow .ld{flex:1;font-size:12.5px;line-height:1.45}
  .laterow .ld small{display:block;color:var(--muted);font-size:10.5px}
  .laterow button{all:unset;cursor:pointer;padding:8px 12px;border-radius:11px;background:var(--amber);color:#1a1206;font-size:12px;font-weight:600;white-space:nowrap}
  .laterow button:disabled{opacity:.4;cursor:not-allowed}
  @media (prefers-reduced-motion: reduce){ .spinner{animation:none} button.submit{transition:none} }
</style>
</head>
<body>
  <div class="card">
    <div class="langbar">
      <button id="langTh" onclick="setLang('th')">ไทย</button>
      <button id="langMm" onclick="setLang('mm')">မြန်မာ</button>

    <div id="profile" class="profile">
      <img id="avatar" class="avatar" src="">

      </div>
    </div>

    <div class="section">
      <div class="label" id="txtTypeLabel">ประเภทการลา</div>
      <div class="chips" id="typeChips">
        <button class="chip" data-type="personal" onclick="selectType('personal')">
          <span class="ic">🗂️</span><span class="tt" id="typePersonalTh">ลากิจ</span><span class="st" id="typePersonalMm">ကိုယ်ရေးခွင့်</span>
        </button>
        <button class="chip" data-type="sick" onclick="selectType('sick')">
          <span class="ic">🤒</span><span class="tt" id="typeSickTh">ลาป่วย</span><span class="st" id="typeSickMm">နာမကျန်းခွင့်</span>
        </button>
        <button class="chip" data-type="unpaid" onclick="selectType('unpaid')">
          <span class="ic">📄</span><span class="tt" id="typeUnpaidTh">ลาไม่รับค่าจ้าง</span><span class="st" id="typeUnpaidMm">လစာမဲ့ခွင့်</span>
        </button>
        <button class="chip" data-type="annual" id="chipAnnual" style="display:none" onclick="selectType('annual')">
          <span class="ic">🏖️</span><span class="tt" id="typeAnnualTh">พักร้อน</span><span class="st" id="typeAnnualMm">နှစ်ပတ်လည်ခွင့်</span>
        </button>
        <button class="chip" data-type="comp_day" id="chipComp" style="display:none" onclick="selectType('comp_day')">
          <span class="ic">🎟️</span><span class="tt" id="typeCompTh">หยุดชดเชย</span><span class="st" id="typeCompMm">အစားထိုးနားရက်</span>
        </button>
      </div>
      <div class="comphint" id="compHint"></div>
    </div>

    <div class="section">
      <div class="label" id="txtDateLabel">วันที่ลา</div>
      <div class="daterow">
        <div class="field"><span class="field-label" id="txtFrom">เริ่ม</span><input id="dateFrom" type="date"></div>
        <div class="field"><span class="field-label" id="txtTo">ถึง (ถ้าลาหลายวัน)</span><input id="dateTo" type="date"></div>
      </div>
    </div>

    <div class="section">
      <span class="field-label" id="txtReasonLabel">เหตุผลเพิ่มเติม (ไม่บังคับ)</span>
      <textarea id="reason" placeholder=""></textarea>
    </div>

    <div class="section" id="certSection" style="display:none">
      <span class="field-label" id="txtCertLabel">ใบรับรองแพทย์ (ถ้ามี)</span>
      <button class="certbtn" id="btnCert" onclick="pickCert()">📷 <span id="txtCertBtn">แนบรูปใบรับรองแพทย์</span></button>
      <input type="file" id="certInput" accept="image/*" multiple style="display:none">
      <div class="thumbs" id="certThumbs"></div>
      <div class="certnote" id="certNote"></div>
    </div>

    <div class="rulebox" id="rulebox"></div>

    <div id="statusBox" class="status"></div>

    <button class="submit" id="btnSubmit" onclick="doSubmit()">📤 <span id="txtSubmit">ยื่นใบลา</span></button>

    <div class="footer" id="txtFooter">ใบลาจะส่งตรงถึง HR อนุมัติ</div>

    <div class="latebox" id="lateBox">
      <div class="label" id="txtLateLabel">ส่งใบรับรองแพทย์ย้อนหลัง</div>
      <div class="certnote" id="txtLateSub" style="margin:-4px 0 6px">เลือกใบลาป่วยที่ยื่นไปแล้ว แล้วแนบรูป — ส่งตรงถึง HR</div>
      <div id="lateList"></div>
      <input type="file" id="lateInput" accept="image/*" multiple style="display:none">
    </div>
  </div>

const SET_LANG_URL = "https://sxthurchkwuojymzfodx.supabase.co/functions/v1/liff-set-lang";
function syncLangToServer(x){
  try{
    if(typeof liff==="undefined" || !liff.isLoggedIn) return;
    const idToken = liff.getIDToken && liff.getIDToken();
    if(!idToken) return;
    fetch(SET_LANG_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ idToken, lang:x }) }).catch(()=>{});
  }catch(e){}
}

/* [รอบ 23] หยุดชดเชย: แสดงชิปเมื่อมีสิทธิ์คงเหลือ (ถาม liff-leave-submit action "balance") */
let COMP = null;   // {available, credits:[{source_date,days}]}
function fmtD(iso){ const [y,m,d]=String(iso).split("-"); return lang==="mm" ? `${+d}/${+m}/${y}` : `${+d}/${+m}/${+y+543}`; }
let ANNUAL = null;   // [รอบ 25] {enabled, eligibleFrom, quota, left}
function nDaysSel(){ const f=document.getElementById("dateFrom").value, to=document.getElementById("dateTo").value||f; return Math.round((new Date(to+"T00:00:00Z") - new Date(f+"T00:00:00Z"))/86400000) + 1; }
function renderCompHint(){
  const box = document.getElementById("compHint"); if(!box) return;
  if(selectedType==="sick"){ box.textContent = t(CERT && CERT.enabled ? "sickHintAttach" : "sickHint"); box.style.display = "block"; return; }
  if(selectedType==="annual" && ANNUAL){ box.textContent = t("annualHint")(ANNUAL.left, ANNUAL.quota); box.style.display = "block"; return; }
  if(!COMP || !(COMP.available>0) || selectedType!=="comp_day"){ box.style.display="none"; return; }
  const src = (COMP.credits||[]).slice(0,4).map(c=>fmtD(c.source_date)).join(", ");
  box.textContent = t("compHint")(COMP.available, src);
  box.style.display = "block";
}
async function loadCompBalance(){
  try{
    const idToken = liff.getIDToken(); if(!idToken) return;
    const res = await fetch(SUBMIT_URL, { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ idToken, action:"balance", lang }) });
    const j = await res.json().catch(()=>null);
    if(!res.ok || !j) return;
    const today = new Date(Date.now()+7*3600*1000).toISOString().slice(0,10);
    if(j.annual && j.annual.enabled && j.annual.eligibleFrom && today >= j.annual.eligibleFrom && j.annual.left>0){
      ANNUAL = j.annual; document.getElementById("chipAnnual").style.display = "";
    }
    if(j.compEnabled && j.available>0){ COMP = j; document.getElementById("chipComp").style.display = ""; }
    if(j.certs && j.certs.enabled){ CERT = j.certs; renderCerts(); renderLate(); renderCompHint(); }
    const shown = [...document.querySelectorAll("#typeChips .chip")].filter(c=>c.style.display!=="none").length;
    document.getElementById("typeChips").classList.toggle("four", shown===4);
  }catch(e){ /* ไม่มีสิทธิ์/ตรวจไม่ได้ → ไม่แสดงชิป */ }
}
function selectType(code){
  selectedType = code;
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on", c.dataset.type===code));
  renderCompHint(); renderCerts();
}

/* ===== [รอบ 27] ใบรับรองแพทย์ (ลาป่วย) — ย่อรูป/แปลง HEIC แล้วส่งไปกับใบลา · ส่งย้อนหลังได้ ===== */
let CERT = null;        // {enabled, retentionDays, perSubmit, sick:[{leaveId, from, to, days, count}]}
let certDraft = [];     // [{dataUrl}]
function loadScriptOnce(src){ return new Promise((res,rej)=>{ if(document.querySelector('script[src="'+src+'"]')){ res(); return; } const s=document.createElement("script"); s.src=src; s.onload=()=>res(); s.onerror=()=>rej(new Error("load")); document.head.appendChild(s); }); }
function isHeic(f){ return /hei[cf]/i.test(f.type||"") || /\.hei[cf]$/i.test(f.name||""); }
function drawCert(img, w0, h0){
  let max = 1600, q = 0.82, d = "";
  for(let i=0;i<4;i++){
    let w=w0, h=h0;
    if(w>h && w>max){ h=Math.round(h*max/w); w=max; } else if(h>=w && h>max){ w=Math.round(w*max/h); h=max; }
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h; const cx=cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,w,h); cx.drawImage(img,0,0,w,h);
    d = cv.toDataURL("image/jpeg", q);
    if(!d || d.indexOf("data:image/jpeg")!==0 || d.length<1000) throw new Error("canvas");
    if(d.length*0.75 <= 950*1024) return d;
    max=Math.round(max*0.8); q=Math.max(0.6,q-0.08);
  }
  return d;
}
async function prepareCert(file){
  if(!file || !file.size) throw new Error("empty");
  let src = file;
  if(isHeic(file)){
    try{ if(!window.heic2any) await loadScriptOnce("https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js");
      const out = await window.heic2any({ blob:file, toType:"image/jpeg", quality:0.85 }); src = Array.isArray(out)?out[0]:out; }catch(e){ console.warn("heic2any", e); }
  }
  try{
    return await new Promise((resolve,reject)=>{ const img=new Image(); const url=URL.createObjectURL(src);
      img.onload=()=>{ URL.revokeObjectURL(url); try{ resolve(drawCert(img, img.naturalWidth||img.width, img.naturalHeight||img.height)); }catch(e){ reject(e); } };
      img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error("img")); }; img.src=url; });
  }catch(e1){
    if(typeof createImageBitmap!=="function") throw e1;
    const bmp = await createImageBitmap(src); return drawCert(bmp, bmp.width, bmp.height);
  }
}
async function prepareMany(files, limit){
  const ok=[]; let bad=0;
  for(const f of [...files].slice(0, limit)){ try{ ok.push({ dataUrl: await prepareCert(f) }); }catch(e){ bad++; } }
  return { ok, bad, over: Math.max(0, files.length-limit) };
}
function perSubmit(){ return (CERT && CERT.perSubmit) || 3; }
function renderCerts(){
  const sec = document.getElementById("certSection"); if(!sec) return;
  const on = !!(CERT && CERT.enabled && selectedType==="sick");
  sec.style.display = on ? "" : "none";
  if(!on) return;
  document.getElementById("txtCertBtn").textContent = certDraft.length ? t("certMore") : t("certBtn");
  document.getElementById("btnCert").style.display = certDraft.length >= perSubmit() ? "none" : "";
  const g = document.getElementById("certThumbs"); g.innerHTML = "";
  certDraft.forEach((c,i)=>{ const d=document.createElement("div"); d.className="thumb"; d.innerHTML='<img src="'+c.dataUrl+'" alt=""><button onclick="rmCert('+i+')">✕</button>'; g.appendChild(d); });
  const n = document.getElementById("certNote"); if(!n.classList.contains("err")) n.textContent = t("certNote");
}
function rmCert(i){ certDraft.splice(i,1); renderCerts(); }
function pickCert(){ document.getElementById("certInput").click(); }
document.getElementById("certInput").addEventListener("change", async (ev)=>{
  const files = [...(ev.target.files||[])]; ev.target.value = "";
  if(!files.length) return;
  const note = document.getElementById("certNote"); note.classList.remove("err"); note.textContent = "⏳ " + t("certPreparing");
  const room = perSubmit() - certDraft.length;
  const r = await prepareMany(files, room);
  certDraft = certDraft.concat(r.ok);
  if(r.bad || r.over){ note.classList.add("err"); note.textContent = "⚠️ " + [r.bad ? t("certBad")(r.bad) : "", r.over ? t("certMax")(perSubmit()) : ""].filter(Boolean).join(" · "); }
  else note.textContent = t("certNote");
  renderCerts();
});

let lateTarget = null;
function renderLate(){
  const box = document.getElementById("lateBox"); if(!box) return;
  const list = (CERT && CERT.enabled && CERT.sick) || [];
  box.style.display = list.length ? "block" : "none";
  document.getElementById("lateList").innerHTML = list.map(g=>`<div class="laterow">
      <div class="ld">🤒 ${fmtD(g.from)}${g.to!==g.from?" – "+fmtD(g.to):""} (${g.days} ${t("daysUnit")})<small>${g.count ? t("lateHas")(g.count) : t("lateNone")}</small></div>
      <button onclick="pickLate(${g.leaveId})" ${g.count>=5?"disabled":""}>${t("lateBtn")}</button></div>`).join("");
}
function pickLate(id){ lateTarget = id; document.getElementById("lateInput").click(); }
document.getElementById("lateInput").addEventListener("change", async (ev)=>{
  const files = [...(ev.target.files||[])]; ev.target.value = "";
  if(!files.length || !lateTarget) return;
  showStatus("⏳ " + t("certPreparing"), "info");
  const r = await prepareMany(files, perSubmit());
  if(!r.ok.length){ showStatus("⚠️ " + t("certBad")(r.bad||files.length), "err"); return; }
  showStatus("⏳ " + t("lateSending"), "info");
  try{
    const idToken = liff.getIDToken(); if(!idToken) throw new Error(t("idErr"));
    const res = await fetch(SUBMIT_URL, { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ idToken, action:"attach", leaveId: lateTarget, certs: r.ok.map(c=>c.dataUrl), lang }) });
    const j = await res.json().catch(()=>({error:t("srvErr")}));
    if(!res.ok || j.error) throw new Error(j.error || t("genErr"));
    showStatus("✅ " + j.message + (r.bad ? " · " + t("certBad")(r.bad) : ""), "ok");
    const g = (CERT.sick||[]).find(x=>x.leaveId===lateTarget); if(g) g.count += (j.certsSaved||r.ok.length);
    renderLate();
  }catch(err){ showStatus("⚠️ " + err.message, "err"); }
});

const statusBox = document.getElementById("statusBox");
const btnSubmit = document.getElementById("btnSubmit");
function showStatus(msg, type){ statusBox.textContent = msg; statusBox.className = "status show " + type; }
function setBusy(busy, label){ btnSubmit.disabled = busy; if(busy) showStatus("⏳ " + (label||t("submitting")), "info"); }

async function doSubmit(){
  if(!selectedType){ showStatus("⚠️ " + t("needType"), "err"); return; }
  const from = document.getElementById("dateFrom").value;
  const to = document.getElementById("dateTo").value || from;
  if(!from){ showStatus("⚠️ " + t("needDate"), "err"); return; }
  if(to < from){ showStatus("⚠️ " + t("badRange"), "err"); return; }
  const reason = document.getElementById("reason").value.trim();
  if(selectedType==="comp_day" && COMP){
    const nDays = Math.round((new Date(to+"T00:00:00Z") - new Date(from+"T00:00:00Z"))/86400000) + 1;
    if(nDays > COMP.available){ showStatus("⚠️ " + t("compShort")(COMP.available), "err"); return; }
  }
  if(selectedType==="annual" && ANNUAL && nDaysSel() > ANNUAL.left){ showStatus("⚠️ " + t("annualShort")(ANNUAL.left), "err"); return; }
  setBusy(true);
  try{
    if(!liff.isLoggedIn()){ liff.login(); return; }
    const idToken = liff.getIDToken();
    if(!idToken) throw new Error(t("idErr"));

    const res = await fetch(SUBMIT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ idToken, leaveType: selectedType, dateFrom: from, dateTo: to, reason, lang },
        (selectedType==="sick" && CERT && CERT.enabled && certDraft.length) ? { certs: certDraft.map(c=>c.dataUrl) } : {}))
    });
    const json = await res.json().catch(()=>({error:t("srvErr")}));
    if(!res.ok || json.error) throw new Error(json.error || t("genErr"));

    showStatus("✅ " + (json.message || t("okMsg")(json.days||1)), "ok");
    btnSubmit.disabled = true;
    if(selectedType==="sick" && (json.days||1)>3 && !json.certsSaved) showStatus("✅ " + (json.message || t("okMsg")(json.days||1)) + " — " + t("sickLong"), "ok");
    if(json.certsFailed) showStatus("✅ " + (json.message || t("okMsg")(json.days||1)) + "\n" + t("certFailed")(json.certsFailed), "ok");
    if(selectedType==="sick"){ certDraft = []; renderCerts(); loadCompBalance(); }
    if(selectedType==="annual" && ANNUAL){ ANNUAL.left = Math.max(0, ANNUAL.left - (json.days||1)); renderCompHint(); }
    if(selectedType==="comp_day" && COMP){ COMP.available = Math.max(0, COMP.available - (json.days||1)); COMP.credits = (COMP.credits||[]).slice(json.days||1); renderCompHint(); }
  }catch(err){
    showStatus("⚠️ " + err.message, "err");
    btnSubmit.disabled = false;
  }
}

async function init(){
  try{
    const cfgRes = await fetch(CONFIG_URL);
    const cfg = await cfgRes.json();
    if(cfg.companyName) document.getElementById("companyName").textContent = cfg.companyName;
    if(!cfg.liffId) throw new Error(t("noCfg"));

    await liff.init({ liffId: cfg.liffId });
    if(!liff.isLoggedIn()){
      showStatus("⏳ " + t("loginLine"), "info");
      liff.login();
      return;
    }
    const profile = await liff.getProfile();
    document.getElementById("profile").style.display = "flex";
    document.getElementById("avatar").src = profile.pictureUrl || "";
    document.getElementById("displayName").textContent = profile.displayName || "";
    loadCompBalance();
  }catch(err){
    showStatus("⚠️ " + err.message, "err");
    btnSubmit.disabled = true;
  }
}
document.getElementById("dateFrom").value = new Date().toISOString().slice(0,10);
document.getElementById("dateTo").value = new Date().toISOString().slice(0,10);
setLang(lang);
init();
</script>
