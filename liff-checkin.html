<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ลงเวลา · HRMS CENTER</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --amber:#f7941d; --amber-lo:#e07d0a; --amber-glow:rgba(247,148,29,.35);
    --ink:#0d1017; --ink-2:#151a24; --panel:#1b2130; --panel-2:#212838;
    --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
    --txt:#eef1f6; --muted:#8b94a7; --muted-2:#5f6982;
    --ok:#34d399; --ok-bg:rgba(52,211,153,.12); --err:#f87171; --err-bg:rgba(248,113,113,.12); --info:#60a5fa; --info-bg:rgba(96,165,250,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(120% 80% at 50% -10%, #23304a 0%, transparent 55%),
      radial-gradient(90% 60% at 50% 110%, #1a1f2e 0%, transparent 60%),
      var(--ink);
    font-family:"Sora","Noto Sans Thai",-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--txt); padding:22px;
  }
  body.lang-mm{ font-family:"Padauk","Noto Sans Thai","Sora",sans-serif; }
  .card{
    width:100%; max-width:400px; position:relative;
    background:linear-gradient(180deg, var(--panel) 0%, var(--ink-2) 100%);
    border:1px solid var(--line-2); border-radius:26px;
    padding:26px 24px 22px;
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 30px 70px -20px rgba(0,0,0,.75);
  }
  /* top hairline glow */
  .card::before{content:"";position:absolute;top:0;left:22px;right:22px;height:1px;
    background:linear-gradient(90deg,transparent,var(--amber-glow),transparent)}
  .langbar{display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px}
  .langbar button{
    all:unset; cursor:pointer; font-family:inherit;
    padding:5px 13px; border-radius:999px; font-size:12px; font-weight:600; letter-spacing:.2px;
    color:var(--muted); border:1px solid var(--line-2); transition:.18s;
  }
  .langbar button.on{ color:var(--ink); background:var(--amber); border-color:transparent; box-shadow:0 4px 14px -4px var(--amber-glow) }
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .logo{
    width:46px;height:46px;border-radius:13px;flex:none;
    background:linear-gradient(145deg,#ffb04a,#e07d0a);
    display:grid;place-items:center;font-size:22px;font-weight:700;color:#1a1206;
    box-shadow:0 6px 18px -6px var(--amber-glow), 0 1px 0 rgba(255,255,255,.4) inset;
  }
  h1{font-size:16.5px;font-weight:600;margin:0;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:11.5px;margin-top:2px;line-height:1.5}
  /* identity chip */
  .profile{display:none;align-items:center;gap:10px;margin-bottom:16px;
    padding:10px 12px;background:var(--panel-2);border:1px solid var(--line);border-radius:14px}
  .avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#2a3346;flex:none}
  .name{font-weight:600;font-size:13.5px}
  .name-sub{font-size:11px;color:var(--muted)}
  /* the clock face — signature element */
  .clockface{
    position:relative; text-align:center; padding:26px 16px 22px; margin-bottom:16px;
    background:
      radial-gradient(80% 120% at 50% 0%, rgba(247,148,29,.10), transparent 70%),
      var(--ink);
    border:1px solid var(--line); border-radius:20px; overflow:hidden;
  }
  .clock-label{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted-2);font-weight:600}
  .clock{font-family:"Sora",sans-serif;font-variant-numeric:tabular-nums;font-weight:700;
    font-size:52px;line-height:1;letter-spacing:1px;margin:8px 0 2px;
    background:linear-gradient(180deg,#fff,#c9d2e3);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .clock-date{font-size:12px;color:var(--muted)}
  /* geo status line */
  .geo{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:14px;
    font-size:12px;color:var(--muted);padding-top:12px;border-top:1px solid var(--line)}
  .geo b{color:var(--ok)}
  .status{font-size:13px;padding:12px 14px;border-radius:13px;margin-bottom:16px;line-height:1.55;display:none;border:1px solid transparent}
  .status.show{display:block}
  .status.ok{background:var(--ok-bg);color:var(--ok);border-color:rgba(52,211,153,.25)}
  .status.err{background:var(--err-bg);color:var(--err);border-color:rgba(248,113,113,.25)}
  .status.info{background:var(--info-bg);color:var(--info);border-color:rgba(96,165,250,.25)}
  .btnrow{display:flex;gap:11px;margin-bottom:11px}
  button.act{
    flex:1;border:none;border-radius:16px;padding:17px 10px;font-size:15px;font-weight:600;font-family:inherit;
    cursor:pointer;transition:transform .12s ease, box-shadow .2s, opacity .2s;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  button.act:active{transform:translateY(1px) scale(.985)}
  button.act:disabled{opacity:.4;cursor:not-allowed}
  .btn-in{background:linear-gradient(145deg,#ffb04a,var(--amber-lo));color:#1a1206;
    box-shadow:0 10px 26px -10px var(--amber-glow), 0 1px 0 rgba(255,255,255,.35) inset}
  .btn-out{background:var(--panel-2);color:var(--txt);border:1px solid var(--line-2)!important}
  .btn-leave{
    width:100%;border:1px dashed var(--line-2);background:transparent;color:var(--amber);
    border-radius:14px;padding:13px;font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:.18s;
  }
  .btn-leave:active{background:rgba(247,148,29,.06)}
  .footer{margin-top:16px;font-size:11px;color:var(--muted-2);line-height:1.55;text-align:center}
  .spinner{width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;
    display:inline-block;vertical-align:-3px;margin-right:6px;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ .spinner{animation:none} button.act{transition:none} }

  /* ปุ่มดูรายงานประจำวันของวันนี้ (แสดงเฉพาะหัวหน้าทีมที่บันทึกรายงานแล้ว) */
  .btn-report{
    width:100%;margin-bottom:11px;border:1px solid rgba(52,211,153,.35);background:var(--ok-bg);color:var(--ok);
    border-radius:14px;padding:13px;font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer;display:none;
  }
  .btn-report:active{transform:translateY(1px)}

  /* ===== paper form (พรีวิวรายงาน + สร้าง PDF) — [รอบ 17.7] รื้อใหม่เป็นกล่อง (box) ทุก section ให้ตรงฟอร์มมาตรฐานงานก่อสร้าง ===== */
  .offscreen{position:fixed;left:-99999px;top:0;z-index:-1}
  .paper{width:780px;background:#fff;color:#1c2333;font-family:"Noto Sans Thai","Sora",sans-serif;font-size:12px;line-height:1.55}
  .paper .p-head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 22px;border-bottom:3px solid #f7941d}
  .paper .p-head-left{display:flex;align-items:center;gap:12px;min-width:0}
  .paper .p-logo{width:50px;height:50px;border-radius:11px;flex:none;object-fit:cover;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .paper .p-co-en{font-size:15.5px;font-weight:800;letter-spacing:.3px;color:#1c2333;white-space:nowrap}
  .paper .p-co-th{font-size:11px;color:#5b6472;margin-top:1px}
  .paper .p-head-right{text-align:right;flex:none}
  .paper .p-doctitle{font-size:15.5px;font-weight:800;letter-spacing:.4px;color:#1c2333}
  .paper .p-doctitle-th{font-size:10.5px;color:#5b6472}
  .paper .p-metabar{display:flex;flex-wrap:wrap;gap:6px 20px;background:#f4f6fa;padding:7px 22px;font-size:10.5px;color:#41495a;border-bottom:1px solid #e1e5ee}
  .paper .p-metabar b{color:#1c2333}
  .paper .p-body{padding:14px 22px 20px}
  .paper .p-box{border:1.3px solid #ccd3e0;border-radius:7px;margin-bottom:10px;overflow:hidden;break-inside:avoid}
  .paper .p-box-title{background:#eef1f7;color:#2a3040;font-weight:800;font-size:11px;padding:6px 11px;border-bottom:1.3px solid #ccd3e0;letter-spacing:.2px}
  .paper .p-box-body{padding:9px 12px}
  .paper .p-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .paper .p-wx{display:flex;gap:6px;flex-wrap:wrap}
  .paper .p-wx span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 8px;border:1.3px solid #dbe0ea;border-radius:7px;font-size:9.5px;color:#8992a3;min-width:40px}
  .paper .p-wx span.on{border-color:#f7941d;background:#fff5e8;color:#a5620a;font-weight:700}
  .paper .p-wx span .ic{font-size:15px}
  .paper table{width:100%;border-collapse:collapse}
  .paper td{padding:3px 0;vertical-align:top;font-size:11.5px}
  .paper td.k{color:#6b7385;width:34%;white-space:nowrap}
  .paper .p-chips span{display:inline-block;background:#f3f5f9;border-radius:7px;padding:3px 9px;margin:2px 4px 2px 0;font-size:11px}
  .paper .p-chips span.lead{background:#fff3e2;color:#a5620a;font-weight:700}
  .paper .p-chips span.temp{background:#eef0f5;color:#6b7280}
  .paper .p-box-body div.txt{white-space:pre-wrap}
  .paper .p-pbar{height:12px;border:1px solid #ccd3e0;border-radius:99px;overflow:hidden;background:#eef1f6;margin-top:5px}
  .paper .p-pbar span{display:block;height:100%;background:linear-gradient(90deg,#f7941d,#ffc169)}
  .paper .p-tags span{display:inline-block;border:1px solid #f0b26a;background:#fff5e8;color:#8a5a12;border-radius:99px;padding:2px 9px;margin:2px 4px 2px 0;font-size:11px}
  .paper .p-imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
  .paper .p-imgs img{width:148px;height:110px;object-fit:cover;border:1px solid #ccd3e0;border-radius:5px}
  .paper .p-sign{display:flex;justify-content:flex-end;margin-top:2px}
  .paper .p-signbx{min-width:230px;text-align:center;border-top:1.3px solid #1c2333;padding-top:7px}
  .paper .p-signbx .nm{font-weight:800;font-size:13px}
  .paper .p-signbx .mt{font-size:10.5px;color:#5b6472;margin-top:2px}
  .paper .p-foot{margin-top:12px;font-size:9.5px;color:#8992a3;text-align:center;border-top:1px solid #e6e9f0;padding-top:7px}

  /* modal พรีวิวรายงาน */
  .modal{position:fixed;inset:0;background:rgba(5,8,14,.9);z-index:60;display:none;flex-direction:column;padding:12px}
  .modal.on{display:flex}
  .modal .mtop{display:flex;gap:8px;margin-bottom:10px}
  .modal .mtop button{border:none;border-radius:12px;padding:12px 8px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
  .modal .mtop .mclose{flex:0 0 28%;background:transparent;border:1px solid var(--line-2);color:var(--txt)}
  .modal .mtop .mzoom{flex:0 0 46px;background:transparent;border:1px solid var(--line-2);color:var(--txt);font-size:15px}
  .modal .mtop .mpdf{flex:1;background:linear-gradient(145deg,#ffb04a,var(--amber-lo));color:#1a1206}
  .modal .mtop button:disabled{opacity:.5}
  .modal .mtitle{font-size:12px;color:var(--muted);margin-bottom:8px;text-align:center}
  .modal .mbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:12px;background:#fff}
  .modal .mscale{transform-origin:top left}
</style>
</head>
<body>
  <div class="card">
    <div class="langbar">
      <button id="langTh" onclick="setLang('th')">ไทย</button>
      <button id="langMm" onclick="setLang('mm')">မြန်မာ</button>
    </div>

    <div class="brand">
      <div class="logo">H</div>
      <div>
        <h1 id="companyName">HRMS CENTER</h1>
        <div class="sub" id="txtSubtitle">ลงเวลาเข้า-ออกงานผ่าน LINE · ยืนยันตำแหน่งด้วย GPS</div>
      </div>
    </div>

    <div id="profile" class="profile">
      <img id="avatar" class="avatar" src="">
      <div>
        <div class="name" id="displayName"></div>
        <div class="name-sub" id="txtProfileSub">พนักงาน</div>
      </div>
    </div>

    <div class="clockface">
      <div class="clock-label" id="txtClockLabel">เวลาปัจจุบัน</div>
      <div class="clock" id="liveClock">--:--</div>
      <div class="clock-date" id="liveDate">—</div>
      <div class="geo" id="geoLine"><span id="txtGeoIdle">📍 แตะปุ่มด้านล่างเพื่อเริ่มลงเวลา</span></div>
    </div>

    <div id="statusBox" class="status"></div>

    <div class="btnrow">
      <button id="btnIn" class="act btn-in" onclick="doAction('in')">📍 <span id="txtBtnIn">ลงเวลาเข้า</span></button>
      <button id="btnOut" class="act btn-out" onclick="doAction('out')">🚪 <span id="txtBtnOut">ลงเวลาออก</span></button>
    </div>

    <button class="btn-report" id="btnReport" onclick="openReport()">📄 <span id="txtBtnReport">ดูรายงานประจำวันวันนี้</span></button>

    <button class="btn-leave" id="btnLeave" onclick="openLeave()">📝 <span id="txtBtnLeave">ยื่นใบลา</span></button>

    <div class="footer" id="txtFooter">อนุญาตให้เข้าถึงตำแหน่ง (GPS) เพื่อยืนยันว่าคุณอยู่ในพื้นที่บริษัท</div>
  </div>

  <!-- พรีวิวรายงานประจำวัน (ภาพฟอร์ม) -->
  <div class="modal" id="reportModal">
    <div class="mtop">
      <button class="mclose" onclick="closeReport()" id="txtBtnClose">ปิด</button>
      <button class="mzoom" onclick="toggleZoom()" id="btnZoom">🔍</button>
      <button class="mpdf" id="btnPdf" onclick="shareReportPdf()">📤 <span id="txtBtnPdf">บันทึก / แชร์ PDF</span></button>
    </div>
    <div class="mtitle" id="reportPick"></div>
    <div class="mbody" id="reportBody"></div>
  </div>

<script>
const CONFIG_URL = "https://sxthurchkwuojymzfodx.supabase.co/functions/v1/liff-config";
const CHECKIN_URL = "https://sxthurchkwuojymzfodx.supabase.co/functions/v1/liff-checkin";
const SET_LANG_URL = "https://sxthurchkwuojymzfodx.supabase.co/functions/v1/liff-set-lang";
// หัวหน้าทีมกด "ลงเวลาออก" -> เด้งไปทำรายงานประจำวัน (รายงาน = ลงเวลาออก) ถ้าตรวจไม่ได้ให้ออกงานตามปกติ
const REPORT_CONTEXT_URL = "https://sxthurchkwuojymzfodx.supabase.co/functions/v1/liff-report-context";
// ดึงรายงานที่บันทึกไปแล้วของวันนี้ มาแสดงเป็นภาพฟอร์ม + สร้าง PDF
const REPORT_VIEW_URL = "https://sxthurchkwuojymzfodx.supabase.co/functions/v1/liff-report-view";
// [รอบ 17.7] อัปโหลด PDF ที่สร้างเสร็จ -> เก็บใน Storage -> คืน https URL จริง (แก้บั๊ก "Unable to open URL" ที่เกิดจาก window.open(blob:) ในเบราว์เซอร์ LINE)
const PDF_UPLOAD_URL = "https://sxthurchkwuojymzfodx.supabase.co/functions/v1/liff-report-pdf";
// โลโก้สำรอง (ตรา AG ออกแบบใหม่คมชัด) — ใช้ก็ต่อเมื่อยังไม่มีโลโก้จริงตั้งค่าไว้ใน ตั้งค่าระบบ → settings.company_logo (liff-report-view จะส่ง company_logo มาให้ถ้ามี)
let RPT_CO_TH = null;  // ชื่อบริษัทภาษาไทย ถ้ามี
// ส่งภาษาที่เลือกไปบันทึกไว้กับพนักงาน + ผูก Rich Menu ให้ตรงภาษาทันที — best effort เงียบๆ ถ้ายังไม่ได้ login
function syncLangToServer(x){
  try{
    if(typeof liff==="undefined" || !liff.isLoggedIn) return;
    const idToken = liff.getIDToken && liff.getIDToken();
    if(!idToken) return;
    fetch(SET_LANG_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ idToken, lang:x }) }).catch(()=>{});
  }catch(e){}
}

// ==== i18n (ไทย / พม่า) — ID-based ปลอดภัย ไม่มีปัญหาผสมภาษา ====
const L = {
  th: {

    geoIdle: "📍 แตะปุ่มด้านล่างเพื่อเริ่มลงเวลา",

    busyIn: "กำลังตรวจสอบตำแหน่งของคุณ...", busyOut: "กำลังบันทึกเวลาออกงาน...", busy: "กำลังดำเนินการ...",
    idErr: "ยืนยันตัวตนกับ LINE ไม่สำเร็จ — เปิดหน้านี้ผ่านแอป LINE อีกครั้ง",

    loginLine: "กำลังเข้าสู่ระบบผ่าน LINE...",

    docTitle: "รายงานประจำวันหน้างาน", docNo: "เลขที่รายงาน", docMan: "กำลังคน",

    docProblem: "ปัญหา & การแก้ไข", docSolution: "วิธีการแก้ไข", docNext: "แผนงานวันถัดไป", docPhotos: "รูปหน้างาน",
    docFooter: "เอกสารนี้ออกโดยระบบ HRMS CENTER — ลงชื่อดิจิทัลผ่าน LINE",
    dProject: "โครงการ", dSite: "สถานที่", dTeam: "ทีม", dLeader: "หัวหน้าทีม", dWeather: "สภาพอากาศ",

// นาฬิกาสด + วันที่ (ไทย พ.ศ. / พม่า ค.ศ.)
function updateClock(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,"0");
  const mm = String(now.getMinutes()).padStart(2,"0");
  const cl = document.getElementById("liveClock"); if(cl) cl.textContent = hh+":"+mm;
  const dEl = document.getElementById("liveDate");
  if(dEl){
    if(lang==="mm"){
      dEl.textContent = now.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    } else {
      const days=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
      const months=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
      dEl.textContent = `${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()+543}`;
    }
  }
}

const statusBox = document.getElementById("statusBox");
const btnIn = document.getElementById("btnIn");
const btnOut = document.getElementById("btnOut");

function showStatus(msg, type){
  statusBox.textContent = msg;
  statusBox.className = "status show " + type;
}
function setBusy(busy, label){
  btnIn.disabled = busy; btnOut.disabled = busy;
  if(busy) showStatus((label||t("busy")) , "info");
}

function getPosition(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({lat: pos.coords.latitude, lng: pos.coords.longitude}),
      () => resolve(null),
      { enableHighAccuracy:true, timeout:8000 }
    );
  });
}

async function doAction(action){
  setBusy(true, "⏳ " + (action==="in" ? t("busyIn") : t("busyOut")));
  try{
    if(!liff.isLoggedIn()){ liff.login(); return; }
    const idToken = liff.getIDToken();
    if(!idToken) throw new Error(t("idErr"));

    // ถ้าเป็นหัวหน้าทีมและยังไม่ได้ทำรายงานวันนี้ -> ไปหน้ารายงานประจำวัน (บันทึกรายงานจะลงเวลาออกให้เอง)
    if(action === "out"){
      try{
        const ctxRes = await fetch(REPORT_CONTEXT_URL, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idToken })
        });
        const ctx = await ctxRes.json();
        if(ctx && ctx.is_leader && ctx.attendance && ctx.attendance.checked_in
           && Array.isArray(ctx.groups) && ctx.groups.some(g => !g.already_reported)){
          window.location.href = "https://liff.line.me/2010634360-YHEKkN47";
          return;
        }
      }catch(e){ /* ตรวจสอบไม่ได้ -> ลงเวลาออกตามปกติ */ }
    }

    let coords = null;
    if(action === "in"){
      coords = await getPosition();
    }

    const res = await fetch(CHECKIN_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ idToken, lat: coords?.lat, lng: coords?.lng, action })
    });
    const json = await res.json().catch(()=>({error:t("srvErr")}));
    if(!res.ok || json.error) throw new Error(json.error || t("genErr"));

    showStatus("✅ " + json.message, "ok");
    if(action === "in") btnIn.disabled = true; else { btnIn.disabled = true; btnOut.disabled = true; checkTodayReport(); }
  }catch(err){
    showStatus("⚠️ " + err.message, "err");
  }finally{
    if(statusBox.className.indexOf("info") > -1) statusBox.className = "status";
    btnIn.disabled = statusBox.className.indexOf("ok")>-1 ? true : false;
  }
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmtDateTh(iso){
  if(!iso) return "-";
  const [y,m,d] = String(iso).slice(0,10).split("-").map(Number);
  if(lang==="mm") return d+"/"+m+"/"+y;
  const mo=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  return d+" "+mo[m-1]+" "+(y+543);
}

}

// แปลงรูปจาก signed URL -> dataURL เพื่อให้ทั้งพรีวิวและ PDF เรนเดอร์ได้แน่นอน (กัน canvas ติด CORS)
async function toDataUrl(url){
  const res = await fetch(url);
  const blob = await res.blob();
  return await new Promise((ok,bad)=>{
    const fr = new FileReader();
    fr.onload = ()=>ok(fr.result); fr.onerror = ()=>bad(new Error("img"));
    fr.readAsDataURL(blob);
  });
}
async function preparePhotos(r){
  if(r._photoData) return;
  const out = [];
  for(const p of (r.photos||[])){
    try{ out.push(await toDataUrl(p.url)); }catch(e){}
  }
  r._photoData = out;
}

// พอดีหน้าจอ <-> ขนาดเต็ม (เลื่อนดูซ้าย-ขวาได้) สำหรับอ่านตัวเล็กบนมือถือ
let RPT_ZOOM = false;
function applyScale(){
  const body = document.getElementById("reportBody");
  const scaleDiv = body.querySelector(".mscale");
  if(!scaleDiv) return;
  const wrap = scaleDiv.parentElement;
  const paper = scaleDiv.querySelector(".paper");
  const s = RPT_ZOOM ? 1 : (body.clientWidth / 760);
  scaleDiv.style.width = "760px";
  scaleDiv.style.transform = "scale("+s+")";
  wrap.style.width = (760 * s) + "px";
  wrap.style.height = (paper.scrollHeight * s) + "px";
  const z = document.getElementById("btnZoom"); if(z) z.textContent = RPT_ZOOM ? "🔎" : "🔍";
}
function toggleZoom(){ RPT_ZOOM = !RPT_ZOOM; applyScale(); }
function closeReport(){ document.getElementById("reportModal").classList.remove("on"); }

function loadScriptOnce(src){
  return new Promise((ok,bad)=>{
    const s = document.createElement("script");
    s.src = src; s.onload = ()=>ok(); s.onerror = ()=>bad(new Error("script"));
    document.head.appendChild(s);
  });
}
async function ensurePdfLibs(){
  if(!window.html2canvas) await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  if(!window.jspdf) await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
}
async function makePdfBlob(r){
  await ensurePdfLibs();
  const host = document.createElement("div");
  host.className = "offscreen";
  host.innerHTML = paperHtml(r);
  document.body.appendChild(host);
  try{
    const canvas = await window.html2canvas(host.firstChild, { scale:2, backgroundColor:"#ffffff", useCORS:true, logging:false });
    const img = canvas.toDataURL("image/jpeg", 0.92);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p","mm","a4");
    const PW = 210, PH = 297, M = 8;
    const iw = PW - M*2;
    const ih = canvas.height * iw / canvas.width;
    const usable = PH - M*2;
    let left = ih, pos = M;
    pdf.addImage(img,"JPEG",M,pos,iw,ih);
    left -= usable;
    while(left > 0){
      pos = M - (ih - left);
      pdf.addPage();
      pdf.addImage(img,"JPEG",M,pos,iw,ih);
      left -= usable;
    }
    return pdf.output("blob");
  } finally { host.remove(); }
}
// สำรอง: โหลดไลบรารี PDF ไม่ได้ -> เปิดหน้าเอกสารให้ใช้ "พิมพ์ -> บันทึกเป็น PDF"
function printFallback(r){
  const w = window.open("", "_blank");
  if(!w) return false;
  const css = [...document.querySelectorAll("style")].map(s=>s.textContent).join("\n");
  w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+
    (r.report_no||t("docTitle"))+'</title><style>'+css+
    'body{margin:0;background:#fff}.paper{width:auto;max-width:820px;margin:0 auto}</style></head><body>'+
    paperHtml(r)+'<script>setTimeout(function(){window.print()},600);<\/script></body></html>');
  w.document.close();
  return true;
}
// [รอบ 17.7] เดิมเปิด blob: URL ตรงๆ ด้วย window.open() ซึ่งเบราว์เซอร์ในแอป LINE เปิดไม่ได้
// (ขึ้น "Unable to open URL due to an unexpected error") -> อัปโหลด PDF ขึ้น Storage ก่อนเสมอ ได้ https URL จริงมาเปิด/แชร์แทน
let PDF_URL_CACHE = null; // {key, url}
async function getPdfUrl(r){
  const key = r.report_no || r.work_date || "report";
  if(PDF_URL_CACHE && PDF_URL_CACHE.key === key) return PDF_URL_CACHE.url;
  await preparePhotos(r);
  const blob = await makePdfBlob(r);
  const idToken = liff.getIDToken && liff.getIDToken();
  const res = await fetch(PDF_UPLOAD_URL, {
    method: "POST",
    headers: { "Content-Type": "application/pdf", "x-id-token": idToken, "x-report-no": key },
    body: blob
  });
  const json = await res.json().catch(()=>({}));
  if(!res.ok || json.error || !json.url) throw new Error(json.error || t("pdfErr"));
  PDF_URL_CACHE = { key, url: json.url };
  return json.url;
}
function inLineClient(){ try{ return typeof liff!=="undefined" && liff.isInClient && liff.isInClient(); }catch(e){ return false; } }
function openExternal(url){
  if(inLineClient()){ try{ liff.openWindow({ url, external:true }); return; }catch(e){} }
  window.open(url, "_blank");
}
async function shareReportPdf(){
  if(!CUR_RPT) return;
  const btn = document.getElementById("btnPdf");
  const old = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'+t("pdfBusy");
  try{
    const url = await getPdfUrl(CUR_RPT);
    const title = t("docTitle")+" "+(CUR_RPT.report_no||"");
    let shared = false;
    // ทางเลือกที่ 1: liff.shareTargetPicker -> แชร์เป็นการ์ดจริงเข้าแชท LINE ได้โดยไม่ต้องออกจากแอป
    if(typeof liff!=="undefined" && liff.isApiAvailable && liff.isApiAvailable("shareTargetPicker")){
      shared = true; // ให้ LINE จัดการ UX เลือกคน/ยกเลิกเอง
      try{
        await liff.shareTargetPicker([{
          type: "flex", altText: title,
          contents: { type:"bubble",
            body: { type:"box", layout:"vertical", spacing:"sm", contents:[
              { type:"text", text:"📋 "+title, weight:"bold", size:"md", wrap:true },
              { type:"text", text:(CUR_RPT.project_name||"")+(CUR_RPT.group_name?" · "+CUR_RPT.group_name:""), size:"sm", color:"#8b94a7", wrap:true }
            ]},
            footer: { type:"box", layout:"vertical", contents:[
              { type:"button", style:"primary", color:"#f7941d", action:{ type:"uri", label:t("btnPdf"), uri:url } }
            ]}
          }
        }]);
      }catch(e){ /* ผู้ใช้ยกเลิก หรือ error ฝั่ง LINE — ไม่ต้องแจ้งซ้ำ */ }
    }
    // ทางเลือกที่ 2: Web Share API มาตรฐาน (เบราว์เซอร์ทั่วไปที่ไม่ใช่ LINE)
    if(!shared && navigator.share){
      try{ await navigator.share({ url, title, text:title }); shared = true; }catch(e){}
    }
    // ทางเลือกสุดท้าย: เปิดลิงก์จริงในเบราว์เซอร์ระบบ ให้ผู้ใช้กดแชร์/ดาวน์โหลดเองจากเมนูเบราว์เซอร์
    if(!shared){ openExternal(url); }
  }catch(e){
    if(!printFallback(CUR_RPT)) alert(t("pdfErr"));
  }
  finally{ btn.disabled = false; btn.innerHTML = old; }
}

async function init(){
  try{
    const cfgRes = await fetch(CONFIG_URL);
    const cfg = await cfgRes.json();
    if(cfg.companyName) document.getElementById("companyName").textContent = cfg.companyName;
    if(!cfg.liffId) throw new Error(t("noCfg"));

    await liff.init({ liffId: cfg.liffId });
    if(!liff.isLoggedIn()){
      showStatus("⏳ " + t("loginLine"), "info");
      liff.login();
      return;
    }
    const profile = await liff.getProfile();
    document.getElementById("profile").style.display = "flex";
    document.getElementById("avatar").src = profile.pictureUrl || "";
    document.getElementById("displayName").textContent = profile.displayName || "";
    // ถ้าวันนี้บันทึกรายงานประจำวันไปแล้ว -> โชว์ปุ่มเปิดดูรายงาน (ภาพฟอร์ม + แชร์ PDF)
    checkTodayReport();
  }catch(err){
    showStatus("⚠️ " + err.message, "err");
    btnIn.disabled = true; btnOut.disabled = true;
  }
}
setLang(lang);
updateClock();
setInterval(updateClock, 1000 * 20); // อัปเดตนาฬิกาทุก 20 วิ
init();
